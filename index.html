<!DOCTYPE html>
<html lang="vi">
<head>
  <title>Trương Minh Sang - Bài nộp cá nhân 20%</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background: #eef1f5;
      color: #2d3440;
      line-height: 1.6;
    }

    header {
      background: #2d3440;
      color: #fff;
      text-align: center;
      padding: 50px 20px 60px;
    }
    header img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #f2a541;
    }
    header h1 {
      margin-top: 14px;
      font-size: 34px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    header p { color: #c9d0da; }
    header .course { color: #f2a541; font-weight: bold; margin-top: 4px; }

    main {
      max-width: 1000px;
      margin: -35px auto 40px;
      padding: 0 20px;
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .card {
      flex: 1 1 400px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
    }

    .card img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: cover;
      object-position: top;
      border-bottom: 4px solid #f2a541;
    }

    .card-body { padding: 20px 24px 24px; }
    .tag {
      display: inline-block;
      font-size: 12.5px;
      font-weight: bold;
      color: #fff;
      background: #f2a541;
      padding: 2px 10px;
      border-radius: 10px;
    }
    .card h2 { font-size: 22px; margin: 8px 0 6px; }
    .card p { font-size: 15px; color: #555; }
    .card .go { display: inline-block; margin-top: 12px; font-weight: bold; color: #e08a1e; }

    footer {
      text-align: center;
      font-size: 14px;
      color: #888;
      padding-bottom: 30px;
    }
  </style>
</head>

<body>
  <header>
    <img src="cv_ca_nhan/images/avatar.jpg" alt="Trương Minh Sang">
    <h1>Trương Minh Sang</h1>
    <p>Sinh viên ngành Sư phạm Tin học – Trường Đại học Sư phạm TP. Hồ Chí Minh</p>
    <p class="course">Bài nộp cá nhân 20%</p>
  </header>

  <main>
    <a class="card" href="ho_ca_vui_nhon/ho_ca.html">
      <img src="assets/thumb_ho_ca.jpg" alt="Hình minh họa bài Hồ cá vui nhộn">
      <div class="card-body">
        <span class="tag">Bài 6.1.1</span>
        <h2>Hồ cá vui nhộn</h2>
        <span class="go">Xem bài &rarr;</span>
      </div>
    </a>

    <a class="card" href="cv_ca_nhan/cv.html">
      <img src="assets/thumb_cv.jpg" alt="Hình minh họa bài CV cá nhân">
      <div class="card-body">
        <span class="tag">Bài 6.1.3</span>
        <h2>CV cá nhân</h2>
        <span class="go">Xem bài &rarr;</span>
      </div>
    </a>
  </main>

  <footer>&copy; 2026 Trương Minh Sang</footer>
</body>
</html>
